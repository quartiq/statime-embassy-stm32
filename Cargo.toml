[package]
name = "statime-embassy-stm32"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PTP ordinary-clock runner for statime on Embassy STM32 Ethernet"
repository = "https://github.com/quartiq/statime-embassy-stm32"
readme = "README.md"

[[bin]]
name = "ptp"
required-features = ["example"]

[features]
default = []
stabilizer = ["example"]
example = [
	"dep:cortex-m",
	"dep:cortex-m-rt",
	"dep:defmt-rtt",
	"dep:panic-probe",
	"dep:rtic",
	"dep:static_cell",
	"embassy-net/dhcpv4",
	"embassy-stm32/rt",
	"embassy-stm32/stm32h743zi",
	"embassy-stm32/time-driver-tim12",
	"embassy-stm32/unstable-pac",
	"embassy-time/generic-queue-8",
]

[dependencies]
rand_core = "0.6"
rand_xorshift = "0.3"
statime = { version = "0.4.0", default-features = false }
cortex-m = { version = "0.7.7", features = [
	"inline-asm",
	"critical-section-single-core",
], optional = true }
cortex-m-rt = { version = "0.7", features = ["device"], optional = true }
defmt = "1.0.1"
defmt-rtt = { version = "1.1.0", optional = true }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = [
	"defmt",
	"medium-ethernet",
	"multicast",
	"packetmeta-id",
	"proto-ipv4",
	"udp",
] }
embassy-stm32 = { version = "0.6.0", default-features = false, features = [
	"defmt",
	"ptp",
] }
embassy-time = { version = "0.5.1", default-features = false, features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
rtic = { version = "2.1", features = ["thumbv7-backend"], optional = true }
static_cell = { version = "2.1.1", optional = true }

[patch.crates-io]
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-usb-synopsys-otg = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }

[profile.release]
codegen-units = 1
opt-level = "s"
debug = true
lto = "fat"
